name: hydratrace-local

services:
  hydradb-node:
    image: ghcr.io/hydra-db/hydradb:0.1.1@sha256:db78309a233be54662db29744047e985a39b51c45a270d1a1f47c31a62cdb709
    restart: unless-stopped
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: development
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=hydradb-node:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./data/store:/data/store
      - ./data/cache:/data/cache
      - ./secrets/auth-token:/data/auth-token:ro

  hydradb-indexer:
    image: ghcr.io/hydra-db/hydradb:0.1.1@sha256:db78309a233be54662db29744047e985a39b51c45a270d1a1f47c31a62cdb709
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/graph-indexer"]
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: development
      GRAPH_ID: default
      GRAPH_CELLS: cell-0
      GRAPH_DATA_CACHE_DIR: /data/indexer-cache
      GRAPH_INDEXER_ADMIN_ADDR: 0.0.0.0:9091
      GRAPH_INDEXER_INTERVAL_MS: "5000"
      GRAPH_INDEXER_RETAIN_PREVIOUS: "1"
      GRAPH_INDEXER_BUILD_MODE: full
      RUST_MIN_STACK: "33554432"
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - ./data/store:/data/store
      - ./data/indexer-cache:/data/indexer-cache
    depends_on:
      - hydradb-node
